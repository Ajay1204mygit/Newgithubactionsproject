name: sonarqube pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarqube:
    runs-on: ["wsl-linux"]

    steps:
      - name: checkoutcode
        uses: actions/checkout@v4
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=nodejs 
            -Dsonar.sources=. 
            -Dsonar.host.url=http://localhost:9000
            -Dsonar.token=sqp_8d38e0e89160a8cef9328b99d22eb7565a293cf1
