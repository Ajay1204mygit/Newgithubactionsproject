name: sonarqube pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarqube:
    runs-on: ["wsl-linux"]

    steps:
      - name: checkoutcode
        uses: actions/checkout@v4
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=Nodeapp 
            -Dsonar.sources=. 
            -Dsonar.host.url= ${{vars.SONAR_HOST_URL}}
            -Dsonar.token=${{secrets.SONAR_TOKEN}}
