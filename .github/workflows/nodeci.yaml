name: Nodeapp CI Pipeline

on:
 push:
  branches: ["main"]
 pull_request: 
  branches: ["main"]
 workflow_dispatch:

jobs:
 sonar:
  runs-on: ["wsl-linux"]
  steps:
   - name: checkoutcode
     uses: actions/checkout@v4
   - name: SonarQube Scan
     uses: sonarsource/sonarqube-scan-action@v8
     with:
       args: >
         -Dsonar.projectKey=Nodeapp 
         -Dsonar.sources=. 
         -Dsonar.host.url=${{  vars.SONAR_HOST_URL }}
         -Dsonar.token=${{ secrets.SONAR_TOKEN1 }}
 docker:
  runs-on: ["wsl-linux"]
   steps:
      - name: checkoutcode
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build docker image
        run: docker build -f Dockerfile.destroless -t distroless .

      - name: Tag docker image
        run: |
         SHA="${GITHUB_SHA::7}"
         echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
         docker tag distroless  ${{ vars.DOCKERHUB_USERNAME }}/nodejs:$SHA

      - name : Push to Docker HUB
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/nodejs:$SHA
        
