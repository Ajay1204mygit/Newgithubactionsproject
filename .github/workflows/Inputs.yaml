name: node pipeline with Inputs

on:
 workflow_dispatch:
  inputs:
   environment:
    description: selecct the environment
    required: true
    default: development
    type: choice
    options:
      - development
      - prod  
   Port:
    description: select the port
    required: true
    default: '8080'

jobs:
 node:
  runs-on: wsl-linux
  strategy:
   matrix:
    node-version: [24, 26]
  steps:
   - name: Checkout repository
     uses: actions/checkout@v7
   - name: Set up Node.js
     uses: actions/setup-node@v7
     with:
      node-version: ${{ matrix.node-version }}
   - name: Install packages
     run: |
      npm install
   - name: Run application
     run: |
      node server.js ${{github.event.inputs.environment}} &
      sleep 5
      curl http://localhost:${{github.event.inputs.Port}}
      pkill -f node
