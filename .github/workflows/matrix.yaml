name: node pipeline

on:
 push:
  branches: ["main"]
 workflow_dispatch:

jobs:
 node:
  runs-on: wsl-linux
  strategy:
   matrix:
    node-version: [24, 26]
  steps:
   - name: Checkout repository
     uses: actions/checkout@v7
   - name: Set up Node.js
     uses: actions/setup-node@v7
     with:
      node-version: ${{ matrix.node-version }}
   - name: Install packages
     run: |
      npm install
   - name: Run application
     run: |
      npm server.js &
      sleep 5
      curl http://localhost:8080/
      pkill -f node
