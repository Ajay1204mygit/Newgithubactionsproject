name: Docker build and Push

inputs:
  username:
   description: Docker Hub username
   required: true
  password:
   description: Docker hub password
   required: true
  dockerfilename:
   description: Docker file name
   required: true
  dockerhubrepo:
   description: Docker Hub Repo name
   required: true
runs:
 using: composite
 steps:
  - name: Login to Docker Hub
    uses: docker/login-action@v4
    with:
       username: ${{ inputs.username }}
       password: ${{ inputs.password }}
  - name: Build docker image
    shell: bash
    run: docker build -f ${{ inputs.dockerfilename }} -t dockerimage .

  - name: Tag docker image
    shell: bash
    run: |
        SHA="${GITHUB_SHA::7}"
        echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
        docker tag dockerimage  ${{ inputs.username }}/${{ inputs.dockerhubrepo }}:$SHA

  - name : Push to Docker HUB
    shell: bash
    run: docker push ${{ inputs.username }}/${{ inputs.dockerhubrepo }}:$SHA
 
  
